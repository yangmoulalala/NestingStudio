[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nesting-studio"
version = "1.0.0"
description = "Thickness-aware automatic nesting and visualization studio for sheet parts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NestingStudio contributors"}]
keywords = ["cad", "nesting", "sheet-metal", "dxf", "step", "cam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cadquery-ocp==7.9.3.1.1",
    "ezdxf>=1.4,<2",
    "pyclipper>=1.3,<2",
    "numpy>=2,<3",
    "shapely>=2.1,<3",
    "svgelements>=1.6,<2",
    "PySide6>=6.9,<7",
]

[project.scripts]
nesting-studio = "nesting_studio.app:main"
nesting-cli = "auto_nest:main"

[tool.setuptools]
packages = ["nesting", "nesting_studio"]
py-modules = ["auto_nest", "step_thickness_classifier"]

[tool.setuptools.package-data]
nesting_studio = ["assets/*.svg"]
